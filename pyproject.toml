[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-cicd-handbook"
version = "1.0.0"
description = "Infrastructure as Code, automated data quality gates, Kubernetes for data workloads, and enterprise CI/CD pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Santosh Jammi"}
]
keywords = ["data-engineering", "lakehouse", "data platform engineering & operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
